# Обновления зависимостей приходят сюда PR'ом, а не красным гейтом у всех сразу.
#
# Зачем: за один день гейт `audit:prod` трижды краснел на всех ветках подряд из-за
# advisory, опубликованных на версии, которые уже стояли в lockfile (js-yaml, postcss,
# nanoid). Репозиторий при этом не менялся. Каждый раз это выяснялось в момент, когда
# кому-то нужно было слить готовую работу, и чинилось вручную.
#
# Оговорка про lockfile: PR от Dependabot надо смотреть тем же взглядом, что и ручную
# правку — не потерялись ли платформенные записи (`@emnapi/runtime` и подобные), без
# которых `npm ci` падает на Linux. Число пакетов в lockfile до и после обязано
# совпадать, если обновляется одна зависимость. Проверено на себе: `npm audit fix`
# локальным npm 11 такие записи вырезает.
version: 2

updates:
  # ─── Пакеты одного класса допуска: web + scripts ───────────────────────────
  # Один scope через `directories` позволяет Dependabot обновить общую
  # зависимость в обоих пакетах одним PR. Секция dependencies/devDependencies не
  # является признаком риска: `astro` и `tsx` показывают, почему это было бы
  # ложным разделением. CMS остаётся отдельным scope ниже.
  - package-ecosystem: npm
    directories:
      - /web
      - /scripts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    groups:
      # Только patch/minor: major всегда остаётся отдельным PR.
      web-scripts-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # ─── CMS ────────────────────────────────────────────────────────────────────
  # Здесь `audit:prod` намеренно report-only из-за upstream-advisory в Strapi, поэтому
  # обновления особенно легко не заметить: гейт про них молчит по построению.
  - package-ecosystem: npm
    directory: /cms
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      cms-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # ─── Сами workflow ──────────────────────────────────────────────────────────
  # Actions закреплены полными SHA; читаемая major-версия остаётся в комментарии
  # рядом с каждым `uses:`. Dependabot обновляет такие пины отдельным PR, поэтому
  # изменение исполняемого кода действия всегда видно в diff.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
