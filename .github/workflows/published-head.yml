name: Published main head monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      main_sha:
        description: Optional test override for the main SHA
        required: false
        type: string
      main_created_at:
        description: Optional test override for the main appearance time
        required: false
        type: string
      published_sha:
        description: Optional test override for the published SHA (or none)
        required: false
        type: string
      now:
        description: Optional test clock in ISO-8601 form
        required: false
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  published-head:
    name: Published main head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Compare main with the latest successful Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVERRIDE_MAIN_SHA: ${{ inputs.main_sha }}
          OVERRIDE_MAIN_CREATED_AT: ${{ inputs.main_created_at }}
          OVERRIDE_PUBLISHED_SHA: ${{ inputs.published_sha }}
          OVERRIDE_NOW: ${{ inputs.now }}
        run: |
          override_args=()
          if [ -n "$OVERRIDE_MAIN_SHA" ] || [ -n "$OVERRIDE_MAIN_CREATED_AT" ] || [ -n "$OVERRIDE_PUBLISHED_SHA" ]; then
            override_args+=(
              --main-sha "$OVERRIDE_MAIN_SHA"
              --main-created-at "$OVERRIDE_MAIN_CREATED_AT"
              --published-sha "$OVERRIDE_PUBLISHED_SHA"
            )
          fi
          if [ -n "$OVERRIDE_NOW" ]; then override_args+=(--now "$OVERRIDE_NOW"); fi
          node --experimental-strip-types web/scripts/check-dependency-update-gates.ts published-head \
            --max-lag 1800000 "${override_args[@]}"
