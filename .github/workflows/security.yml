name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '19 4 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Runtime dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - web
          - scripts
          - payments

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm run audit:prod

  cms-dependency-report:
    name: CMS runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cms

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        run: env -u NODE_ENV -u NPM_CONFIG_PRODUCTION -u NPM_CONFIG_OMIT npm ci --include=dev

      - name: Audit runtime dependencies
        run: |
          env -u NODE_ENV -u NPM_CONFIG_PRODUCTION -u NPM_CONFIG_OMIT npm audit --omit=dev --audit-level=high --json > audit-report.json || audit_status=$?
          node ../scripts/security-audit-policy.mjs audit-report.json "${audit_status:-0}"

      - name: Upload runtime audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cms-runtime-audit-report
          path: cms/audit-report.json
          if-no-files-found: warn

      - name: Visibility note
        if: always()
        run: |
          # Ни версию, ни состав advisory не пишем строкой: захардкоженное устаревает молча
          # и потом читается как факт (было "Strapi 5.40.0" при 5.51.2, и утверждение
          # "carries advisories with no clean fix" осталось бы и после их закрытия).
          # Всё, что печатается, вычисляется из манифеста и из отчёта этого же прогона.
          strapi_version="$(node -p "require('./package.json').dependencies['@strapi/strapi'] || 'unknown'")"
          counts="$(node -p "const v=require('./audit-report.json').metadata.vulnerabilities; ['critical','high','moderate','low'].map(k=>k+'='+(v[k]||0)).join(' ')" 2>/dev/null || echo 'report unavailable')"
          echo "CMS runtime audit uses npm's high threshold; full-tree findings are checked separately."
          echo "@strapi/strapi ${strapi_version}; prod-tree advisories in this run: ${counts}"

  full-dependency-audit:
    name: Complete dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - web
          - cms
          - scripts
          - payments
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install complete dependency tree
        run: env -u NODE_ENV -u NPM_CONFIG_PRODUCTION -u NPM_CONFIG_OMIT npm ci --include=dev
      - name: Audit runtime and development dependencies
        run: |
          env -u NODE_ENV -u NPM_CONFIG_PRODUCTION -u NPM_CONFIG_OMIT npm audit --include=dev --audit-level=high --json > audit-report.json || audit_status=$?
          node ../scripts/security-audit-policy.mjs audit-report.json "${audit_status:-0}"
      - name: Upload full dependency audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: full-dependency-audit-${{ matrix.package }}
          path: ${{ matrix.package }}/audit-report.json
          if-no-files-found: warn

  codeql-analysis:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
          - actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  security-policy-tests:
    name: Security policy contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Test audit validation and workflow contract
        run: node --test scripts/security-policy.test.mjs

  security-policy:
    name: Security policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - secret-scan
      - dependency-audit
      - cms-dependency-report
      - full-dependency-audit
      - codeql-analysis
      - security-policy-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Require every security producer to succeed
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          RUNTIME_AUDITS: ${{ needs.dependency-audit.result }}
          CMS_RUNTIME_AUDIT: ${{ needs.cms-dependency-report.result }}
          FULL_AUDITS: ${{ needs.full-dependency-audit.result }}
          CODEQL: ${{ needs.codeql-analysis.result }}
          POLICY_TESTS: ${{ needs.security-policy-tests.result }}
        run: node scripts/verify-security-policy.mjs
