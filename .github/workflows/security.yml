name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '19 4 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Runtime dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - web
          - scripts
          - payments

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm run audit:prod

  cms-dependency-report:
    # `continue-on-error` на УРОВНЕ ДЖОБА здесь был, и он сводил на нет всю аккуратность внутри:
    # флаг гасит любой ненулевой исход, включая падение шага «измерение не выполнено» — то есть
    # битый JSON, сетевую ошибку и отсутствие отчёта. Джоб выглядел бы пройденным ровно в том
    # случае, ради которого проверка и писалась. Report-only относится к НАХОДКАМ, а не к сбою
    # измерения: код возврата `npm audit` глотается адресно, в своём шаге и с объяснением.
    name: CMS runtime dependency audit (report only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime audit report
        run: |
          # Код возврата npm audit — это НАХОДКИ, и глотается он ЗДЕСЬ, адресно: джоб
          # report-only по составу advisory, а не по своей исправности. Сбой самого измерения —
          # сеть, npm, битый JSON — не глотается: пустой отчёт с зелёным джобом читается как
          # «advisory нет».
          set -o pipefail
          npm audit --omit=dev --json > audit-report.json || audit_status=$?
          # Проверяется не «поле есть», а что отчёт СОДЕРЖИТ ЧИСЛА по всем уровням: пустой
          # объект `{"metadata":{"vulnerabilities":{}}}` прежнюю проверку проходил, и заметка
          # ниже печатала нули — «advisory нет» вместо «измерение не выполнено».
          node -e "
            const v = require('./audit-report.json')?.metadata?.vulnerabilities;
            const levels = ['critical', 'high', 'moderate', 'low', 'info'];
            if (!v || typeof v !== 'object') process.exit(1);
            const missing = levels.filter((k) => typeof v[k] !== 'number');
            if (missing.length) { console.error('нет числовых полей: ' + missing.join(', ')); process.exit(1); }
          " || { echo '::error::audit-report.json невалиден — измерение не выполнено'; exit 1; }
          echo "npm audit exit=${audit_status:-0} (ненулевой код здесь означает найденные advisory)"

      - name: Upload runtime audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cms-runtime-audit-report
          path: cms/audit-report.json
          if-no-files-found: warn

      - name: Visibility note
        if: always()
        run: |
          # Ни версию, ни состав advisory не пишем строкой: захардкоженное устаревает молча
          # и потом читается как факт (было "Strapi 5.40.0" при 5.51.2, и утверждение
          # "carries advisories with no clean fix" осталось бы и после их закрытия).
          # Всё, что печатается, вычисляется из манифеста и из отчёта этого же прогона.
          strapi_version="$(node -p "require('./package.json').dependencies['@strapi/strapi'] || 'unknown'")"
          counts="$(node -p "const v=require('./audit-report.json').metadata.vulnerabilities; ['critical','high','moderate','low'].map(k=>k+'='+(v[k]||0)).join(' ')" 2>/dev/null || echo 'report unavailable')"
          echo "CMS runtime audit is report-only (this job does not gate the PR)."
          echo "@strapi/strapi ${strapi_version}; prod-tree advisories in this run: ${counts}"
          echo "Local script cms/npm run audit:prod uses --audit-level=critical; see AGENTS.md for when its red result blocks a task."
