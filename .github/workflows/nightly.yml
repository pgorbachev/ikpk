name: Nightly full checks

# Полный compat-прогон (7 проектов) и parity-тесты против живого ikpk.su.
# Осознанно НЕ в PR-гейте: живой сайт вне нашего контроля, флаки не должны
# блокировать мерджи (план 004, Этап 0). После переключения DNS parity
# переводится в snapshot-режим (Этап 5).

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    name: Cross-browser compat (7 projects)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build site
        run: npm run build

      - name: Run compat tests
        run: npm run test:e2e:compat

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-compat-report
          path: web/playwright-report/
          retention-days: 7

  parity-remote:
    name: Parity vs live ikpk.su
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run remote parity tests
        run: npm run test:build:remote

  cms-to-site:
    # Сквозная цепочка «админка → кнопка «Обновить сайт» → опубликованный сайт» (cms/tests/e2e).
    # Не в проверках PR: сборка Strapi и две сборки сайта — это минуты, а не секунды.
    name: CMS to site end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cms/package-lock.json
            web/package-lock.json

      - name: Install CMS dependencies
        working-directory: cms
        run: npm ci

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Run end-to-end test
        working-directory: cms
        run: npm run test:e2e
