name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unit and build tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            payments/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install payments dependencies
        working-directory: payments
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run build tests (dist checks)
        run: npm run test:build

      # Демо-сборка и проверки её вывода — ВНУТРИ обязательного прогона, а не рядом.
      # Гейтом публикации является ровно то, что лежит внутри workflow Tests: отдельный
      # workflow формально удовлетворял бы требование «объём гейта назван явно», но
      # выкладку бы не останавливал. Цена названа и принята владельцем: сломанное демо
      # блокирует публикацию боевого сайта, потому что демо — часть продукта.
      #
      # Тот же джоб, что и боевые проверки (решение 6 change deploy-gated-on-tests):
      # отдельный джоб платил бы за npm ci и установку зависимостей второй раз.
      # Вывод — в dist-demo, поэтому боевые гейты выше остаются на своём предмете.
      - name: Run demo build tests (dist-demo checks)
        run: npm run test:demo

      # Тот же dist-demo, который только что проверили. e2e-smoke его скачивает и
      # не собирает заново: вторая сборка в чужом джобе — как раз то, что ловит
      # demo-gate (решение 6). uses-шаги не наследуют defaults.run.working-directory,
      # путь — от корня репозитория.
      - name: Upload demo site
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-demo
          path: web/dist-demo
          if-no-files-found: error
          retention-days: 1

  # Тесты пакета scripts/ гоняются отдельным джобом: у него свой package.json и свой
  # lockfile, а джоб выше целиком работает в web/. Без этого джоба новые тесты
  # оказались бы вне CI — ровно тот случай осиротевших тестов, который описан в
  # docs/test-audit-2026-08-07.md (находка 1): файл в репозитории есть, а результат
  # его прогона никто не видит.
  scripts-unit:
    name: Scripts unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-smoke:
    name: Playwright smoke (desktop + mobile)
    runs-on: ubuntu-latest
    needs: unit-and-build
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Run smoke tests
        run: npm run test:e2e:smoke

      - name: Run accessibility tests (axe-core)
        run: npm run test:e2e:a11y

      # Характеризационные проверки каталога статей. Отдельным шагом, а не внутри
      # smoke: у smoke свой предмет, и слияние наборов скрыло бы, что именно упало.
      # Только desktop: предмет — охват поиска и сортировки, он от ширины окна не
      # зависит, а раскладка в области каталога не описана вовсе.
      - name: Run article catalog characterization tests
        run: npm run test:e2e:catalog

      - name: Run payment form e2e (production)
        run: npm run test:e2e:payment

      - name: Download demo site
        uses: actions/download-artifact@v7
        with:
          name: web-dist-demo
          path: web/dist-demo

      - name: Run payment form e2e (demo)
        run: npm run test:e2e:payment-demo

      # Фильтр расписания по месяцу. Отдельным шагом и в ЭТОМ workflow: публикацию
      # останавливает только `Tests`, а проверка, положенная в файл, который не
      # запускает ни один workflow, зелена ровно потому, что её никто не выполняет.
      # Мобильный сценарий задаёт свой viewport внутри теста, поэтому проект один.
      - name: Run schedule month filter tests
        run: npm run test:e2e:schedule

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report
          path: web/playwright-report/
          retention-days: 7
