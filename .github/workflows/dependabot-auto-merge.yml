name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, auto_merge_enabled, auto_merge_disabled]

permissions:
  actions: read
  checks: write
  contents: write
  pull-requests: write

jobs:
  policy:
    name: Policy
    uses: "pgorbachev/ikpk/.github/workflows/dependabot-auto-merge-policy.yml@634dad5c75b1f67b16c4fa73f072d14717a3b305" # engine v1
