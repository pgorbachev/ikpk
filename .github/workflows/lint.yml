name: Lint and Typecheck

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.package }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: web
            node-version: 22
            typecheck-script: typecheck
          - package: cms
            node-version: 22
            typecheck-script: typecheck
          - package: scripts
            node-version: 22
            typecheck-script: typecheck
          - package: payments
            node-version: 22
            typecheck-script: typecheck

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run typecheck
        run: npm run ${{ matrix.typecheck-script }}

  # Файлы интеграции OpenSpec патчатся после генерации: из коробки они зовут бинарь
  # `openspec`, которого в проекте нет. Без этой проверки потеря патча (свежий init,
  # апгрейд, ручная правка) обнаружилась бы только когда у кого-то не запустится
  # /opsx:*, — то есть молча. Проверка репозиторного уровня, поэтому вне матрицы
  # пакетов и без установки зависимостей.
  openspec-integration:
    name: OpenSpec integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Ссылки, привязанные к ревизии (`путь@<sha>:строка`), проверяются чтением файла
          # из этой ревизии, а при `fetch-depth: 1` её в клоне нет вовсе — гейт тогда честно
          # выходит кодом 2 «не смогла измерить». Полная история нужна ему, а не «на всякий
          # случай».
          fetch-depth: 0

      - name: Check for bare openspec calls
        run: ./bin/check-openspec-integration

      - name: Check file references in OpenSpec artifacts
        run: ./bin/check-spec-refs
