name: Deploy to GitHub Pages

# Публикуется только то, что прошло проверку. Раньше триггером был `push: main`, и
# публикация шла параллельно с прогоном тестов, не глядя на его результат: единственной
# защитой оставался branch protection — настройка вне репозитория, которую нельзя ни
# проверить в CI, ни восстановить из кода.
#
# `needs:` между разными workflow в GitHub Actions невозможен, поэтому связь делается
# событием `workflow_run` о завершении `Tests`.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Очередь, а не вытеснение. Два события `workflow_run` подряд попадают в одну группу, и
  # при `cancel-in-progress: true` перезапуск давнего прогона отменил бы идущую
  # легитимную публикацию раньше, чем сработает сверка с вершиной ветки. От устаревших
  # коммитов защищает сверка, а не отмена.
  cancel-in-progress: false

jobs:
  build:
    # Условие ПО-СОБЫТИЙНОЕ: у `workflow_dispatch` объекта `workflow_run` нет вовсе, и
    # голое `github.event.workflow_run.conclusion == 'success'` было бы для него ложно —
    # то есть молча выключило бы ручную публикацию.
    #
    # Происхождение проверяется здесь же, в условии джоба, а не только шагом ниже.
    # Причина: прогон, запущенный событием `workflow_run`, получает секреты и токены
    # записи, даже если исходный прогон их не имел (документация GitHub Actions). У этого
    # workflow это `pages: write` и `id-token: write`, а `Tests` триггерится на
    # `pull_request` без ограничения на форки. Шаг с `exit 1` остановил бы выполнение, но
    # не отменяет того, что джоб с такими правами вообще запустился на чужом коде;
    # условие джоба не даёт ему стартовать.
    #
    # На фильтр `branches: [main]` как на защиту от форков не полагаемся: это фильтр по
    # имени ветки, а имя ветки в чужом репозитории выбирает её автор.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Ручной запуск публикует основную ветку
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "main" ]; then
            echo "::error::ручной запуск с ветки $REF_NAME опубликовал бы её содержимое; публикуется только main"
            exit 1
          fi

      - name: Происхождение прогона
        if: github.event_name == 'workflow_run'
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::прогон запущен из стороннего репозитория $HEAD_REPO — код не выгружается"
            exit 1
          fi

      # Выгружается ПРОВЕРЕННЫЙ коммит, а не текущая голова ветки: при `workflow_run`
      # GITHUB_SHA и GITHUB_REF указывают на дефолтную ветку, а не на коммит
      # завершившегося прогона, поэтому без явного `ref` связь «проверили то, что
      # публикуем» теряется.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Проверенный коммит не устарел
        if: github.event_name == 'workflow_run'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::не удалось получить вершину main — публиковать вслепую нельзя"
            exit 1
          fi
          if [ "$HEAD_SHA" != "$tip" ]; then
            echo "::error::прогон относится к $HEAD_SHA, а вершина main — $tip; публикация откатила бы сайт"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Astro site
        working-directory: web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
