name: Deploy to GitHub Pages

# Публикуется только то, что прошло проверку. Раньше триггером был `push: main`, и
# публикация шла параллельно с прогоном тестов, не глядя на его результат: единственной
# защитой оставался branch protection — настройка вне репозитория, которую нельзя ни
# проверить в CI, ни восстановить из кода.
#
# `needs:` между разными workflow в GitHub Actions невозможен, поэтому связь делается
# событием `workflow_run` о завершении `Tests`.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    outputs:
      # SHA, содержимое которого собрано. Нужен джобу публикации: он сверит его с
      # вершиной ветки ещё раз, уже перед самой выкладкой.
      sha: ${{ steps.target.outputs.sha }}
    # Условие ПО-СОБЫТИЙНОЕ: у `workflow_dispatch` объекта `workflow_run` нет вовсе, и
    # голое `github.event.workflow_run.conclusion == 'success'` было бы для него ложно —
    # то есть молча выключило бы ручную публикацию.
    #
    # Происхождение проверяется здесь же, в условии джоба, а не только шагом ниже.
    # Причина: прогон, запущенный событием `workflow_run`, получает секреты и токены
    # записи, даже если исходный прогон их не имел (документация GitHub Actions). У этого
    # workflow это `pages: write` и `id-token: write`, а `Tests` триггерится на
    # `pull_request` без ограничения на форки. Шаг с `exit 1` остановил бы выполнение, но
    # не отменяет того, что джоб с такими правами вообще запустился на чужом коде;
    # условие джоба не даёт ему стартовать.
    #
    # На фильтр `branches: [main]` как на защиту от форков не полагаемся: это фильтр по
    # имени ветки, а имя ветки в чужом репозитории выбирает её автор.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Ручной запуск публикует основную ветку
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "main" ]; then
            echo "::error::ручной запуск с ветки $REF_NAME опубликовал бы её содержимое; публикуется только main"
            exit 1
          fi

      - name: Происхождение прогона
        if: github.event_name == 'workflow_run'
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::прогон запущен из стороннего репозитория $HEAD_REPO — код не выгружается"
            exit 1
          fi

      - name: Целевой коммит
        id: target
        env:
          TARGET: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "::error::не удалось определить публикуемый коммит"
            exit 1
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

      # Выгружается ПРОВЕРЕННЫЙ коммит, а не текущая голова ветки: при `workflow_run`
      # GITHUB_SHA и GITHUB_REF указывают на дефолтную ветку, а не на коммит
      # завершившегося прогона, поэтому без явного `ref` связь «проверили то, что
      # публикуем» теряется.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Ранняя сверка: стоит ли вообще тратить сборку. Она НЕ доказывает, что публиковать
      # можно — между ней и выкладкой пройдёт сборка, за которую вершина успеет сдвинуться.
      # Решающая сверка стоит в джобе публикации, внутри группы сериализации.
      - name: Проверенный коммит ещё вершина (ранняя сверка)
        env:
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::не удалось получить вершину main — публиковать вслепую нельзя"
            exit 1
          fi
          if [ "$HEAD_SHA" != "$tip" ]; then
            echo "::error::прогон относится к $HEAD_SHA, а вершина main — $tip; публикация откатила бы сайт"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Astro site
        working-directory: web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    # Группа СЕРИАЛИЗАЦИИ ПУБЛИКАЦИЙ, и висит она на джобе, а не на файле. На файле она
    # затягивала бы в группу и те прогоны, которые заведомо ничего не опубликуют — из
    # форка, по устаревшему коммиту, — а ожидающий прогон в группе ровно один. Такой
    # прогон вытеснил бы ожидающую легитимную публикацию, и та исчезла бы без всякого
    # сигнала: её деплой числился бы отменённым. На джобе в группу попадают только те,
    # кто дошёл до выкладки.
    #
    # Идущая публикация не отменяется, и ожидающие не теряются.
    #
    # `cancel-in-progress: false` бережёт идущую: при `true` перезапуск давнего прогона
    # вытеснил бы её раньше сверки с вершиной, а от устаревших коммитов должна защищать
    # сверка.
    #
    # `queue: max` бережёт ОЖИДАЮЩИЕ. По умолчанию в группе держится ровно один
    # ожидающий, и новый отменяет прежний. Порядок входа при этом не гарантирован —
    # он определяется тем, когда закончилась сборка, а не свежестью коммита. Отсюда
    # тихая потеря публикации: пока идёт X, ожидает свежий B; позже доезжает медленная
    # сборка устаревшего A, вытесняет B из очереди, затем сама падает на сверке — и
    # сайт остаётся на X, хотя B был проверен и актуален. Нового события не будет.
    # `queue: max` держит до 100 ожидающих, поэтому B дожидается своей очереди, а A
    # честно отсеивается сверкой.
    concurrency:
      group: pages
      # Порядок и сочетание существенны: `queue: max` НЕЛЬЗЯ ставить вместе с
      # `cancel-in-progress: true` — такой файл платформа считает невалидным, и деплой
      # перестанет запускаться молча, без красного прогона. Проверяется тестом.
      cancel-in-progress: false
      queue: max
    # Поведение по умолчанию задокументировано: «If a job fails or is skipped, all jobs
    # that need it are skipped unless the jobs use a conditional expression that causes
    # the job to continue» (документация GitHub Actions, про зависимости джобов). То есть
    # без этого условия публикация всё равно не пошла бы без сборки.
    #
    # Условие оставлено как явная запись намерения, а не как страховка от неизвестного:
    # цена ошибки здесь — выкладка артефакта прошлого прогона, и такие места лучше читать
    # прямо из файла, чем выводить из чужого правила. Continuation-семантики оно не
    # включает: `always()` тут нет, и при пропущенной сборке условие ложно.
    #
    # Тестами не стережётся: спека его не требует, а проверка «что-то, чего спека не
    # просила» была бы гейтом без предмета.
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Сверка непосредственно перед выкладкой, внутри группы сериализации. Без неё
      # остаётся большое окно: A проходит раннюю сверку, пока идёт его сборка приезжает B,
      # собирается и публикуется быстрее, а затем медленная сборка A выкладывается поверх
      # свежего B.
      #
      # Честно про остаток: окно сужается, но не исчезает. Группа сериализует ПУБЛИКАЦИИ,
      # а не изменения `main` — между этой сверкой и шагом выкладки в ветку всё ещё может
      # приехать коммит, и тогда опубликуется предыдущий. Атомарного «сравни и выложи»
      # у actions/deploy-pages нет.
      #
      # Чего этот остаток НЕ закрывает — важно не переоценить. `queue: max` бережёт уже
      # созданные публикации от вытеснения, но сам ничего не создаёт: если для приехавшего
      # коммита прогон упадёт, будет отменён следующим push или событие не придёт, его
      # публикации не появится вовсе — и сайт останется на перекрытом коммите сколь угодно
      # долго. Сходимость к вершине здесь не гарантируется ничем; механизм, который заметил
      # бы расхождение и исправил его, — отдельный долг (TD-13), а не следствие очереди.
      - name: Проверенный коммит всё ещё вершина
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.build.outputs.sha }}
        run: |
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::сборка не сообщила публикуемый коммит"
            exit 1
          fi
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ -z "$tip" ]; then
            echo "::error::не удалось получить вершину main — публиковать вслепую нельзя"
            exit 1
          fi
          if [ "$TARGET_SHA" != "$tip" ]; then
            echo "::error::собран $TARGET_SHA, вершина main уже $tip; выкладка откатила бы сайт"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
