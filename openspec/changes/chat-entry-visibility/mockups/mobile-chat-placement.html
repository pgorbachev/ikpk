  const rememberedZoneValue = previousPrivate && previousPrivate.zoneHeight;
  const rememberedZoneHeight = typeof rememberedZoneValue === 'number' ? rememberedZoneValue : NaN;
  const state = {
    width: rememberedWidth === 375 ? 375 : 320,
    zoneHeight: Number.isFinite(rememberedZoneHeight) ? Math.min(96, Math.max(72, rememberedZoneHeight)) : 80
  };
  const positions = [
    { label: 'Начало', key: 'start' },
    { label: 'Середина', key: 'middle' },
    { label: 'Подвал', key: 'footer' }
  ];

  function makeTrigger() {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'ikpk-chat-trigger';
    button.setAttribute('aria-label', 'Написать нам');
    button.innerHTML = '<i data-lucide="message-circle" aria-hidden="true"></i><span>Написать нам</span>';
    button.addEventListener('click', function () {
      const screen = button.closest('.ikpk-screen');
      const panel = screen.querySelector('.ikpk-chat-panel');
      panel.hidden = false;
      panel.querySelector('[data-close-chat]').focus();
    });
    return button;
  }

  function positionScrollports(force) {
    root.querySelectorAll('.ikpk-device').forEach(function (device) {
      const port = device.querySelector('.ikpk-scrollport');
      if (port.clientHeight === 0 || port.clientWidth === 0) return;
      if (!force && device.dataset.positionedWidth === String(state.width)) return;
      const key = device.dataset.position;
      const max = Math.max(0, port.scrollHeight - port.clientHeight);
      port.scrollTop = key === 'start' ? 0 : key === 'middle' ? Math.round(max / 2) : max;
      device.dataset.positionedWidth = String(state.width);
    });
  }

  function renderState(reposition) {
    root.style.setProperty('--ikpk-phone-width', state.width + 'px');
    root.style.setProperty('--ikpk-zone-height', state.zoneHeight + 'px');
    root.querySelector('[data-width-select]').value = String(state.width);
    root.querySelector('[data-zone-height-label]').textContent = state.zoneHeight + ' px';
    root.querySelectorAll('[data-viewport-label]').forEach(function (label) { label.textContent = 'Телефон · ' + state.width + ' px'; });
    if (reposition) requestAnimationFrame(function () { requestAnimationFrame(function () { positionScrollports(true); }); });
  }

  function saveState() {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: { phoneWidth: state.width },
        privateContent: { phoneWidth: state.width, zoneHeight: state.zoneHeight }
      }).catch(function () {});
    }
  }

  root.querySelectorAll('.ikpk-devices').forEach(function (group) {
    const layout = group.dataset.layout;
    positions.forEach(function (position) {
      const fragment = template.content.cloneNode(true);
      const device = fragment.querySelector('.ikpk-device');
      const screen = fragment.querySelector('.ikpk-screen');
      const header = fragment.querySelector('.ikpk-header');
      const scrollport = fragment.querySelector('.ikpk-scrollport');
      device.dataset.position = position.key;
      screen.dataset.layout = layout;
      fragment.querySelector('[data-position-label]').textContent = position.label;
      fragment.querySelector('[data-viewport-label]').textContent = 'Телефон · ' + state.width + ' px';
      const trigger = makeTrigger();
      if (layout === 'zone') {
        scrollport.prepend(header);
        screen.querySelector('.ikpk-chat-slot').appendChild(trigger);
      } else {
        header.insertBefore(trigger, header.querySelector('.ikpk-menu'));
      }
      if (globalThis.ResizeObserver) {
        const resizeObserver = new ResizeObserver(function () { positionScrollports(false); });
        resizeObserver.observe(scrollport);
      }
      fragment.querySelectorAll('[data-local-link]').forEach(function (link) {
        link.addEventListener('click', function (event) { event.preventDefault(); });
      });
      fragment.querySelectorAll('.ikpk-pagination button').forEach(function (button) {
        button.addEventListener('click', function () {
          device.querySelectorAll('.ikpk-pagination button').forEach(function (item) { item.removeAttribute('aria-current'); });
          button.setAttribute('aria-current', 'page');
        });
      });
      fragment.querySelector('[data-close-chat]').addEventListener('click', function () {
        const panel = screen.querySelector('.ikpk-chat-panel');
        panel.hidden = true;
        trigger.focus();
      });
      group.appendChild(fragment);
    });
  });

  renderState(false);
  root.querySelector('[data-width-select]').addEventListener('change', function (event) {
    state.width = Number(event.currentTarget.value);
    if (state.width !== 320 && state.width !== 375) state.width = 320;
    renderState(true);
    saveState();
  });
  if (globalThis.lucide) lucide.createIcons();
  Promise.resolve(document.fonts && document.fonts.ready).then(function () {
    requestAnimationFrame(function () { requestAnimationFrame(function () { positionScrollports(true); }); });
  });
  if (globalThis.Tweak) {
    const zoneGroup = root.querySelector('[data-layout="zone"]');
    const tweak = new Tweak({ container: zoneGroup, onChange: function () {
      renderState(true);
      saveState();
    } });
    tweak.addSlider(state, 'zoneHeight', { label: 'Нижняя свободная зона', min: 72, max: 96, step: 2, unit: 'px', reference: '--ikpk-zone-height' });
  }
  window.addEventListener('openai:set_globals', function (event) {
    const snapshot = event.detail && event.detail.globals && event.detail.globals.widgetState;
    const incomingModel = snapshot && snapshot.modelContent;
    const incomingPrivate = snapshot && snapshot.privateContent;
    if (!snapshot) return;
    const width = Number(incomingPrivate && incomingPrivate.phoneWidth != null ? incomingPrivate.phoneWidth : incomingModel && incomingModel.phoneWidth);
    const zoneValue = incomingPrivate && incomingPrivate.zoneHeight;
    const zoneHeight = typeof zoneValue === 'number' ? zoneValue : NaN;
    if (width === 320 || width === 375) state.width = width;
    if (Number.isFinite(zoneHeight)) state.zoneHeight = Math.min(96, Math.max(72, zoneHeight));
    renderState(true);
  });
  root.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    const panel = event.target.closest('.ikpk-screen')?.querySelector('.ikpk-chat-panel');
    if (!panel || panel.hidden) return;
    panel.hidden = true;
    event.target.closest('.ikpk-screen').querySelector('.ikpk-chat-trigger').focus();
  });
})();
</script>
