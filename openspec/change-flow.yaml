# Журнал переходов состояний change. Эксперимент 27.08 — 24.09.2026.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ tasks.md. `tasks.md` отвечает за прогресс ОДНОЙ реализации;
# очередь и лимит — глобальное состояние ВСЕХ change. Чтобы проверить лимит по tasks.md,
# пришлось бы прочитать восемь файлов, а дешевизна проверки и есть смысл лимита.
#
# ЗАЧЕМ ЖУРНАЛ, А НЕ СНИМОК. Снимок теряет queue time и processing time, без которых
# результат эксперимента не истолковать: «стало быстрее» может означать и «меньше ждали в
# очереди», и «быстрее делали», и это разные выводы с разными следствиями.
#
# ТЕКУЩЕЕ СОСТОЯНИЕ change = поле `to` его ПОСЛЕДНЕЙ записи. Записи только добавляются;
# существующие не правятся и не удаляются — иначе журнал перестаёт быть журналом.
#
# ПОЛЯ:
#   change      — имя каталога в openspec/changes/
#   to          — queued | active | blocked | completed
#   at          — ISO-8601 UTC, момент перехода
#   reason      — почему переход; обязательно, иначе журнал нечитаем через месяц
#   blocked_on  — ОБЯЗАТЕЛЬНО при to: blocked. Что именно ждём: имя change, номер PR,
#                 внешняя сторона. Без этого `blocked` превращается в свалку.
#
# ПОЧЕМУ `blocked` ВЫВЕДЕН ИЗ ЛИМИТА, НО ВОЗРАСТ СЧИТАЕТСЯ: change, ждущий ответа
# заказчика, не занимает исполнителя — но его спека продолжает стареть относительно main,
# и это надо видеть. Иначе `blocked` станет способом обойти лимит.

