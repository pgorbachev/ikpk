title = "ikpk"

# Keep built-in rules. This file only adds an allowlist; it must not replace them.
[extend]
useDefault = true

# gitleaks 8.24 (CI): singular [allowlist], paths only — mixing regexes+paths is AND.
# Maintainer proof script: dispatch branch names, not credentials.
[allowlist]
description = "Named fixtures, not credentials: payment state-matrix labels; trial selftest sentinel PASS-SENTINEL-7f3a"
paths = [
  '''openspec/changes/online-payment-flow/state-matrix4\.py$''',
  '''deploy/trial/selftest\.sh$''',
]
