# Reverse-proxy для api.ikpk.su. Подключается в server { } после TLS.
# Перекрывает унаследованные от server заголовки кеша и HTML error_page.

location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Не $proxy_add_x_forwarded_for: клиентский XFF тогда остаётся левым hop и
    # становится ключом лимита. Единственный источник — крайний доверенный hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_intercept_errors off;
    error_page 502 503 504 /api-json-error;
}

location = /api-json-error {
    internal;
    default_type application/json;
    return 502 '{"status":"error"}';
}
