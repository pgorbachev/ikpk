# НЕПРИНЯТАЯ архитектурная альтернатива, не применяется этим change (пересмотрено
# решением владельца 2026-08-20/21: production endpoint и топология не выбраны —
# `proposal.md`, Развилка 1). Файл — пример reverse-proxy для варианта «отдельный
# HTTPS-хост под платёжный API» (был рассмотрен как «api.ikpk.su», роль prod, Решение
# 13 design.md), сохранён как референс для будущего change `production-payment-rollout`,
# а не как готовая к подключению конфигурация. Подключался бы внутрь блока server после
# TLS, перекрывая унаследованные от server заголовки кеша и HTML error_page. Идея: хост
# целиком выделен под платёжный API (production раздваивается: сайт — GitHub Pages, этот
# хост — только платёжный сервис), поэтому блок ниже покрывает весь легитимный трафик
# хоста буквально по префиксу /payments, но НЕ публикует /readyz наружу (задача 5.10c,
# 6.13 online-payment-flow): гейт спрашивает его изнутри host по 127.0.0.1:8787, а
# запрос извне на путь, не начинающийся с /payments, ни под один блок ниже не подпадает.
location /payments {
    proxy_pass http://127.0.0.1:8787/payments;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Не $proxy_add_x_forwarded_for: клиентский XFF тогда остаётся левым hop и
    # становится ключом лимита. Единственный источник — крайний доверенный hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_intercept_errors off;
    error_page 502 503 504 /api-json-error;
}

location = /api-json-error {
    internal;
    default_type application/json;
    return 502 '{"status":"error"}';
}
