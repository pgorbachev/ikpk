# Обратный прокси стенда (роль stand, дельта Решения 13, задача 5.10c).
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ФАЙЛ, а не `nginx-api.conf`. Тот написан под ОТДЕЛЬНЫЙ host
# `api.ikpk.su`, целиком выделенный под платёжный API (production раздваивается: сайт —
# GitHub Pages, `api.ikpk.su` — только эта служба). У стенда сайт и API — ОДИН origin
# (`http://193.124.115.99`), поэтому нужен ПУТЬ на нём, а не отдельный vhost. Подключается
# в тот же `server { }`, что раздаёт статический сайт стенда.
#
# Наружу открыты РОВНО два маршрута: создание платежа и проверка статуса попытки.
# ДВА ОТДЕЛЬНЫХ location, а не один общий префикс (исправлено по независимому ревью,
# находка F-5, 2026-08-20): единый `^~ /api/payments` прежней редакции покрывал по
# префиксу и `/api/payments/webhook` — маршрут, который наружу открывать не требовалось
# («ровно два маршрута»). Точный `=` и якорный `~` ниже пропускают только буквально эти
# два пути; путь webhook ни под один из них не подпадает и получает обычные 404. /readyz
# НЕ публикуется этой конфигурацией вовсе: гейт выкладки спрашивает его изнутри host по
# http://127.0.0.1:8787/readyz, минуя обратный прокси (спека, Requirement «Личность
# контура сообщается несекретным readiness-ответом»). Блок на весь origin (путь /) на
# платёжный сервис не заводится — иначе весь origin стенда увело бы в сервис, и
# статические страницы перестали бы раздаваться.
#
# Bind сервиса — 127.0.0.1:8787 (`PAYMENT_LISTEN_HOST`/`PAYMENT_LISTEN_PORT`), задаётся
# явно конфигурацией инстанции (`/etc/ikpk-payments/stand.env`), а не умолчанием кода.
location = /api/payments {
    proxy_pass http://127.0.0.1:8787/payments;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Не $proxy_add_x_forwarded_for: клиентский XFF тогда остаётся левым hop и
    # становится ключом лимита. Единственный источник — крайний доверенный hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_intercept_errors off;
    error_page 502 503 504 /api-json-error;
}

location ~ ^/api/payments/([^/]+)/status$ {
    proxy_pass http://127.0.0.1:8787/payments/$1/status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_intercept_errors off;
    error_page 502 503 504 /api-json-error;
}

location = /api-json-error {
    internal;
    default_type application/json;
    return 502 '{"status":"error"}';
}
